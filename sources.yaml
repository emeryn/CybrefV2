    description: All GitHub-reviewed security advisories (OSV format) in one JSON array.
    processor: github_advisories
    output: vulnerabilities/github_advisories.json.gz

  nvd_cve:
    name: NVD CVE
    group: weekly
    homepage: https://nvd.nist.gov/vuln/data-feeds
    description: Full NVD CVE JSON 2.0 feeds per year + recent + modified (original gzip, re-downloaded only when NVD's sha256 changes).
    processor: nvd_cve_feeds
    output: vulnerabilities/nvd/nvdcve-2.0-*.json.gz
    options: {dir: vulnerabilities/nvd}

  nvd_cpe:
    name: NVD CPE dictionary
    group: weekly
    homepage: https://nvd.nist.gov/products/cpe
    description: CPE 2.0 dictionary split by vendor initial (a.json.gz ... z, 0-9, other) - a single file would exceed GitHub's 100 MB limit.
    processor: nvd_cpe_dictionary
    output: vulnerabilities/nvd/cpe/*.json.gz
    options: {dir: vulnerabilities/nvd/cpe}

  mobile_cve:
    name: Mobile CVE
    group: mobile
    homepage: https://github.com/emeryn/CybrefV2/tree/download/src/mcb
    description: Samsung / Pixel / iPhone devices with their patch level, and the CVEs of every mobile bulletin (NVD-enriched). Index + per-year CVE details.
    processor: mobile_cve
    output:
      - vulnerabilities/mobile/index.json
      - vulnerabilities/mobile/cves/*.json
    options: {dir: vulnerabilities/mobile, nvd_dir: vulnerabilities/nvd, csc: XEF, concurrency: 20}

  # ============================================================== frameworks

  mitre_attack_enterprise:
