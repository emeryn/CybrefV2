    group: weekly
    homepage: https://d3fend.mitre.org/
    description: Defensive countermeasures knowledge graph, mapped to ATT&CK (JSON-LD).
    url: https://d3fend.mitre.org/ontologies/d3fend.json
    output: frameworks/mitre_d3fend.json

  mitre_atlas:
    name: MITRE ATLAS
    group: weekly
    homepage: https://atlas.mitre.org/
    description: Adversarial Threat Landscape for AI Systems - tactics, techniques and case studies against ML/AI.
    processor: mitre_atlas
    output: frameworks/mitre_atlas.yaml

  mitre_cwe:
    name: MITRE CWE
    group: weekly
    homepage: https://cwe.mitre.org/
    description: Common Weakness Enumeration catalog.
    url: https://cwe.mitre.org/data/xml/cwec_latest.xml.zip
    extract: unzip
    member: "*.xml"
    output: frameworks/mitre_cwe.xml

  mitre_capec:
    name: MITRE CAPEC
    group: weekly
    homepage: https://capec.mitre.org/
    description: Common Attack Pattern Enumeration and Classification.
    url: https://capec.mitre.org/data/xml/capec_latest.xml
    output: frameworks/mitre_capec.xml

  redcanary_atomic_tests:
    name: Atomic Red Team
    group: weekly
    homepage: https://atomicredteam.io/
    description: Index of Atomic Red Team tests (ATT&CK technique, test name, GUID, platform) to validate detections.
    url: https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/Indexes/Indexes-CSV/index.csv
    output: frameworks/redcanary_atomic_tests.csv

