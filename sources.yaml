# Cybref dataset catalog - single source of truth for downloads, workflows and docs.
#
# NAMING CONVENTION (checked when the catalog loads)
#   <category>/<provider>_<dataset>[_<variant>].<ext>[.gz]
#   - category: top-level folder, one of threat_intel, lol, vulnerabilities, frameworks, network,
#     domains, registries, detection
#   - provider first (abusech_, mitre_, ieee_...), then the dataset, then the variant (_ipv4, _recent...)
#   - lowercase snake_case; the file stem IS the source id
#   - the extension tells the real format: json, jsonl (one JSON per line), csv, tsv,
#     txt (one entry per line, # comments), xml, yaml, pem; .gz when compressed
#   - multi-file sources (NVD, mobile) use a folder and keep upstream file names
#
# FIELDS
#   name, group (daily|weekly|mobile), homepage, description   required, used in docs
#   url          one URL or a list of fallbacks; supports {today:%Y-%m} / {last_month:%Y-%m}
#   output       file path (or list / glob patterns for processors)
#   extract      gunzip | unzip   (member: name or glob inside the zip)
#   encoding     source charset, re-encoded to UTF-8 (e.g. utf-16)
#   compress     true -> stored gzipped (output must end with .gz). Required above ~90 MB.
#   min_bytes / min_lines / shrink_guard   validation (shrink_guard: reject if new size < ratio * old, 0 = off)
#   retries      download attempts (default 5)
#   headers      extra HTTP headers, ${ENV_VAR} substituted (header dropped if unset)
#   user_agent   browser -> send browser-like headers
#   processor    custom Python step (src/cybref/processors), with free-form `options`

sources:

  # ============================================================== threat_intel

  abusech_threatfox_recent:
    name: ThreatFox
    group: daily
    homepage: https://threatfox.abuse.ch/
    description: IOCs of the last 48h (IP:port, domains, URLs, hashes) tagged by malware family.
    url: https://threatfox.abuse.ch/export/json/recent/
    output: threat_intel/abusech_threatfox_recent.json
    headers: {Auth-Key: "${ABUSECH_AUTH_KEY}"}
    shrink_guard: 0.1

  abusech_feodotracker_c2_ips:
    name: Feodo Tracker
    group: daily
    homepage: https://feodotracker.abuse.ch/
    description: Botnet C2 servers (Dridex, Emotet, QakBot, Pikabot...).
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.json
    output: threat_intel/abusech_feodotracker_c2_ips.json
    headers: {Auth-Key: "${ABUSECH_AUTH_KEY}"}
    min_bytes: 2
    shrink_guard: 0

  abusech_urlhaus_online:
    name: URLhaus
    group: daily
    homepage: https://urlhaus.abuse.ch/
    description: Malware distribution URLs currently online.
    url: https://urlhaus.abuse.ch/downloads/csv_online/
    output: threat_intel/abusech_urlhaus_online.csv
    headers: {Auth-Key: "${ABUSECH_AUTH_KEY}"}
    shrink_guard: 0.2

  abusech_malwarebazaar_recent:
    name: MalwareBazaar
    group: daily
    homepage: https://bazaar.abuse.ch/
    description: Malware samples of the last 48h (hashes, signature, file type, tags).
    url: https://bazaar.abuse.ch/export/csv/recent/
    output: threat_intel/abusech_malwarebazaar_recent.csv
    headers: {Auth-Key: "${ABUSECH_AUTH_KEY}"}
    shrink_guard: 0.1

  abusech_sslbl_certificates:
    name: SSL Blacklist
    group: daily
    homepage: https://sslbl.abuse.ch/
    description: SHA1 fingerprints of TLS certificates used by botnet C2 servers.
    url: https://sslbl.abuse.ch/blacklist/sslblacklist.csv
    output: threat_intel/abusech_sslbl_certificates.csv

  openphish_urls:
    name: OpenPhish
    group: daily
    homepage: https://openphish.com/
    description: Community feed of currently active phishing URLs.
    url: https://openphish.com/feed.txt
    output: threat_intel/openphish_urls.txt
    shrink_guard: 0.1

  malwarefilter_phishing_domains:
    name: Phishing Filter
    group: daily
    homepage: https://gitlab.com/malware-filter/phishing-filter
    description: Phishing domains aggregated from OpenPhish, PhishTank and others, with false positives (top sites) removed.
    url: https://malware-filter.gitlab.io/malware-filter/phishing-filter-domains.txt
    output: threat_intel/malwarefilter_phishing_domains.txt
    shrink_guard: 0.2

  proofpoint_et_compromised_ips:
    name: ET Compromised IPs
    group: daily
    homepage: https://rules.emergingthreats.net/
    description: Proofpoint Emerging Threats list of known compromised hosts.
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    output: threat_intel/proofpoint_et_compromised_ips.txt
    shrink_guard: 0.2

  spamhaus_drop_ipv4:
    name: Spamhaus DROP (IPv4)
    group: daily
    homepage: https://www.spamhaus.org/blocklists/do-not-route-or-peer/
    description: Do Not Route Or Peer - hijacked or criminal netblocks.
    url: https://www.spamhaus.org/drop/drop_v4.json
    output: threat_intel/spamhaus_drop_ipv4.jsonl

  spamhaus_drop_ipv6:
    name: Spamhaus DROP (IPv6)
    group: daily
    homepage: https://www.spamhaus.org/blocklists/do-not-route-or-peer/
    description: IPv6 counterpart of the DROP list.
    url: https://www.spamhaus.org/drop/drop_v6.json
    output: threat_intel/spamhaus_drop_ipv6.jsonl

  spamhaus_asndrop:
    name: Spamhaus ASN-DROP
    group: daily
    homepage: https://www.spamhaus.org/blocklists/do-not-route-or-peer/
    description: Autonomous systems operated by cybercriminals.
    url: https://www.spamhaus.org/drop/asndrop.json
    output: threat_intel/spamhaus_asndrop.jsonl

  firehol_level1:
    name: FireHOL Level 1
    group: daily
    homepage: https://iplists.firehol.org/
    description: Aggregated "safe to block" networks (fullbogons, DROP, Feodo, DShield...).
    url: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
    output: threat_intel/firehol_level1.txt

  stamparm_ipsum:
    name: IPsum
    group: daily
    homepage: https://github.com/stamparm/ipsum
    description: Malicious IPs aggregated from 30+ blocklists, with the number of lists each IP appears on (filter on >= 3 for a reliable set).
    url: https://raw.githubusercontent.com/stamparm/ipsum/master/ipsum.txt
    output: threat_intel/stamparm_ipsum.txt
    shrink_guard: 0.2

  dshield_block:
    name: DShield block list
    group: daily
    homepage: https://isc.sans.edu/block.html
    description: SANS ISC top 20 attacking /24 subnets of the last 3 days.
    url: https://feeds.dshield.org/block.txt
    output: threat_intel/dshield_block.txt
    shrink_guard: 0

  cinsscore_badguys:
    name: CINS Army
    group: daily
    homepage: https://cinsscore.com/
    description: IPs with poor reputation seen by the Sentinel IPS network.
    url: https://cinsscore.com/list/ci-badguys.txt
    output: threat_intel/cinsscore_badguys.txt
    shrink_guard: 0.2

  blocklistde_all:
    name: blocklist.de
    group: daily
    homepage: https://www.blocklist.de/
    description: IPs reported for attacks (SSH, mail, web, FTP brute force) in the last 48h.
    url: https://lists.blocklist.de/lists/all.txt
    output: threat_intel/blocklistde_all.txt
    shrink_guard: 0.2

  ransomwarelive_groups:
    name: Ransomware.live groups
    group: daily
    homepage: https://www.ransomware.live/
    description: Ransomware groups with their leak sites, aliases and activity.
    url: https://api.ransomware.live/v2/groups
    output: threat_intel/ransomwarelive_groups.json

  ransomwarelive_victims_recent:
    name: Ransomware.live victims
    group: daily
    homepage: https://www.ransomware.live/
    description: Latest victims claimed on ransomware leak sites (group, sector, country, dates).
    url: https://api.ransomware.live/v2/recentvictims
    output: threat_intel/ransomwarelive_victims_recent.json
    shrink_guard: 0.1

