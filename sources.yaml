    group: weekly
    homepage: https://lolesxi-project.github.io/LOLESXi/
    description: VMware ESXi native binaries used by adversaries.
    url: https://lolesxi-project.github.io/LOLESXi/api/lolesxi.json
    output: lol/lolesxi.json

  lofl:
    name: LOFL
    group: weekly
    homepage: https://lofl-project.github.io/
    description: Living Off the Foreign Land cmdlets and binaries.
    url: https://lofl-project.github.io/api/loflcab.json
    output: lol/lofl.json

  lolapps:
    name: LOLApps
    group: weekly
    homepage: https://lolapps-project.github.io/
    description: Legitimate applications (Greenshot, Notepad++, Teams...) abusable for persistence or execution.
    url: https://lolapps-project.github.io/api/lolapps.json
    output: lol/lolapps.json

  lolc2:
    name: LOLC2
    group: weekly
    homepage: https://lolc2.github.io/
    description: C2 frameworks hiding in legitimate services.
    url: https://raw.githubusercontent.com/lolc2/lolc2.github.io/main/c2_data.json
    output: lol/lolc2.json

  bootloaders:
    name: Bootloaders.io
    group: weekly
    homepage: https://www.bootloaders.io/
    description: Known vulnerable or malicious bootloaders.
    url: https://www.bootloaders.io/api/bootloaders.json
    output: lol/bootloaders.json

  hijacklibs:
    name: HijackLibs
    group: weekly
    homepage: https://hijacklibs.net/
    description: DLL hijacking candidates (DLL, vulnerable executables, expected paths).
    url: https://hijacklibs.net/api/hijacklibs.json
    output: lol/hijacklibs.json

  lottunnels_binaries:
    name: LoTtunnels
    group: weekly
    homepage: https://lottunnels.github.io/
    description: Tunneling binaries usable for proxying or exfiltration.
    processor: lottunnels
    output: lol/lottunnels_binaries.json

  lottunnels_domains:
    name: LoTtunnels domains
    group: weekly
    homepage: https://lottunnels.github.io/
    description: Domains used by tunneling services.
    url: https://raw.githubusercontent.com/LoTtunnels/LoTtunnels.github.io/main/_lottunnels/CSVs/domains.csv
    output: lol/lottunnels_domains.csv

  lots:
    name: LOTS Project
    group: weekly
    homepage: https://lots-project.com/
    description: Legitimate trusted sites abused for C2, phishing or exfiltration.
    processor: html_table
    url: https://lots-project.com/
    output: lol/lots.csv
    user_agent: browser

  filesec_extensions:
    name: FileSec
    group: weekly
    homepage: https://filesec.io/
    description: File extensions abused by attackers.
    processor: html_table
    url: https://filesec.io/
    output: lol/filesec_extensions.csv
    user_agent: browser

  malapi_winapi:
    name: MalAPI.io
    group: weekly
    homepage: https://malapi.io/
    description: Windows APIs abused by malware, by technique.
    processor: malapi
    url: https://malapi.io/
    output: lol/malapi_winapi.csv
    user_agent: browser

  lothardware:
    name: LOTHardware
    group: weekly
    homepage: https://github.com/enesilhaydin/lothardware
    description: Hardware implants and malicious devices (USB, network, RF...).
    url: https://raw.githubusercontent.com/enesilhaydin/lothardware/main/hardwares.json
    output: lol/lothardware.json

  # ============================================================== vulnerabilities

  cisa_kev:
    name: CISA KEV
    group: daily
    homepage: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    description: Known Exploited Vulnerabilities catalog (US).
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    output: vulnerabilities/cisa_kev.json

  enisa_euvd_exploited:
    name: EUVD exploited
    group: daily
    homepage: https://euvd.enisa.europa.eu/
    description: European Vulnerability Database entries flagged as exploited (ENISA) - the EU counterpart of KEV.
    processor: euvd_exploited
    output: vulnerabilities/enisa_euvd_exploited.json

  first_epss:
    name: EPSS
    group: daily
    homepage: https://www.first.org/epss/
    description: Exploit Prediction Scoring System - daily probability of exploitation for every CVE.
    url:
      - https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
      - https://epss.cyentia.com/epss_scores-current.csv.gz
    extract: gunzip
    output: vulnerabilities/first_epss.csv
    min_lines: 100000

  certfr_alertes:
    name: CERT-FR alertes
    group: daily
    homepage: https://www.cert.ssi.gouv.fr/alerte/
    description: ANSSI CERT-FR security alerts (RSS, latest entries).
    url: https://www.cert.ssi.gouv.fr/alerte/feed/
    output: vulnerabilities/certfr_alertes.xml
    shrink_guard: 0.2

  certfr_avis:
    name: CERT-FR avis
    group: daily
    homepage: https://www.cert.ssi.gouv.fr/avis/
    description: ANSSI CERT-FR security advisories (RSS, latest entries).
    url: https://www.cert.ssi.gouv.fr/avis/feed/
    output: vulnerabilities/certfr_avis.xml
    shrink_guard: 0.2

  exploitdb_exploits:
    name: Exploit-DB
    group: weekly
    homepage: https://www.exploit-db.com/
    description: Exploit index with CVE mapping.
    url: https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv
    output: vulnerabilities/exploitdb_exploits.csv
    min_lines: 40000

  metasploit_modules:
    name: Metasploit modules
    group: weekly
    homepage: https://github.com/rapid7/metasploit-framework
    description: Metadata of every Metasploit module (CVE / references, targets, rank) - "is there a weaponized exploit?".
    url: https://raw.githubusercontent.com/rapid7/metasploit-framework/master/db/modules_metadata_base.json
    output: vulnerabilities/metasploit_modules.json

  nuclei_cve_templates:
    name: Nuclei CVE templates
    group: weekly
    homepage: https://github.com/projectdiscovery/nuclei-templates
    description: CVEs with a Nuclei detection template (severity, CVSS, EPSS, template path).
    url: https://raw.githubusercontent.com/projectdiscovery/nuclei-templates/main/cves.json
    output: vulnerabilities/nuclei_cve_templates.jsonl

