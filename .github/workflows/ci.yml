# CI for the `download` branch (code). The scheduled pipeline is refsets.yml (same folder).
name: CI

on:
  push:
    branches: [download]
  pull_request:
    branches: [download]
  workflow_dispatch:
    inputs:
      only:
        description: 'Dry-run fetch of these source ids (comma-separated) into a scratch dir'
        # Keep this list on sources whose host is dependable and that each exercise a
        # different path (plain json/csv, usb_ids and osv_zip processors): a smoke test
        # must fail on our code, not on a third-party site being down.
        default: 'cisa_kev,lolbas,usb_ids,osv_rustsec_cargo,google_play_devices'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Catalog loads and README is in sync
        run: |
          uv run cybref list > /dev/null
          uv run cybref docs
          git diff --exit-code README.md || { echo "::error::README catalog out of date: run 'cybref docs'"; exit 1; }
      - name: Byte-compile
        run: uv run python -m compileall -q src
      - name: Smoke fetch
        run: uv run cybref fetch --out /tmp/data --no-retry --only "${{ inputs.only || 'cisa_kev,lolbas,usb_ids,osv_rustsec_cargo,google_play_devices' }}"
