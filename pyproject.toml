[project]
name = "cybref"
version = "2.0.0"
description = "Automated mirror of cybersecurity reference datasets"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx[brotli]>=0.27",
    "lxml>=5",
    "pyyaml>=6",
]

[project.scripts]
cybref = "cybref.__main__:main"
mcb = "mcb.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybref", "src/mcb"]
